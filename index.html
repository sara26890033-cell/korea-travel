      // Safe expression evaluator for numeric calculators
      function safeEvaluate(expr) {
        try {
          const sanitized = expr.replace(/[^0-9+\-*/.]/g, "");
          if (!sanitized) return "";
          const result = new Function(`return (${sanitized})`)();
          if (result !== undefined && !isNaN(result) && isFinite(result)) {
            return Math.round(result).toString();
          }
        } catch (e) {}
        return expr;
      }

            setPhrases(storedPhrases ? JSON.parse(storedPhrases) : initialPhrases);

            if (storedRate) setExchangeRate(parseFloat(storedRate));
          } catch (e) {
            console.error("Localstorage failed, booting fallback states", e);

            setPhrases(initialPhrases);

          } else if (["+", "-", "*", "/"].includes(key)) {

              const lastChar = prev.slice(-1);
              if (["+", "-", "*", "/"].includes(lastChar)) {

              return prev + key;

                              <button type="button" onClick={() => handleKeypadPress("backspace")} className="py-2.5 bg-white hover:bg-[#FAF5EB]/50 text-[#3F2B20] text-lg sm:text-xl font-extrabold rounded-lg border border-[#E8E1D5]/60 active:scale-95 transition-transform flex items-center justify-center cursor-pointer">⌫</button>
                              <button type="button" onClick={() => handleKeypadPress("+")} className="py-2.5 bg-[#F0EAE1] hover:bg-[#A47551]/10 text-[#A47551] text-lg sm:text-xl font-extrabold rounded-lg border border-[#DCD5C9] active:scale-95 transition-transform cursor-pointer">+</button>
                            </div>

                            {/* Controllers */}
                            <div className="flex gap-2 text-sm sm:text-base font-black select-none">
                              <button
                                type="button"
                                onClick={() => handleKeypadPress("=")}
                                className="flex-2 py-3 bg-[#E8E1D5] hover:bg-[#E2D9C8] text-[#3F2B20] rounded-xl border border-[#D4C9B6] active:scale-95 transition-all cursor-pointer font-sans text-xs sm:text-sm font-black"
                              >
                                ＝ 計算
                              </button>
                              <button
                                type="button"
                                onClick={() => {
                                  const evaluated = safeEvaluate(expenseAmount);
                                  const num = parseFloat(evaluated);
                                  if (!isNaN(num) && num > 0) {
                                    addExpense(spot.id, selectedDay, num, expenseDesc.trim() || spot.title);
                                    setQuickExpenseSpotId(null);
                                    setIsKeypadOpen(false);
                                  }
                                }}
                                className="flex-2 py-3 bg-[#7251B5] hover:bg-[#5E3EA1] text-white rounded-xl active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-1 shadow-3xs font-sans font-black text-xs sm:text-sm"
                              >
                                <span>✔ 確定勾選</span>
                              </button>
                            </div>
                          </div>
                        )}

                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              // Rainy plan backup elements
              <div className="space-y-4">
                {[
                  {
                    title: "海雲台 ClubD OASIS 海景溫泉 SPA 水上樂園",
                    purpose: "LCT 摩天大樓內的奢華頂級市內暖冬室內溫泉、汗蒸幕 ♨️",
                    naverMapUrl: "https://naver.me/xw9sFv18",
                    notes: ["主打可以一邊看著廣安大橋與湛藍尾浦海景，一邊享受室內頂級汗蒸幕與露天溫泉泡湯！", "內部甚至有室內溫水大水上滑水道，無論颳風、暴雨或低溫都能在這裡度過一整天極致放鬆時光！"]
                  },
                  {
                    title: "新世界百貨 Centum City 旗艦店 & SPA LAND 汗蒸幕",
                    purpose: "全世界最大百貨公司 + 號稱釜山五星級豪華頂級汗蒸幕 🧖‍♀️",
                    naverMapUrl: "https://naver.me/xD6GjI6O",
                    notes: ["SPA LAND 採用地底深處天然溫泉水，擁有22個不同特色溫度的溫泉療養池及13個多國風情特色蒸房，室內極致奢華舒適！", "可搭乘地鐵2號線直達「Centum City」站，出站即可開始逛街、看電影、大啖美食廣場，玩累了直接入內舒壓桑拿！"]

                  {
                    title: "Museum 1 海雲台數字媒體美術館",
                    purpose: "視覺效果極具震撼力的室內多媒體科幻奇觀光影藝術展 🎨",
                    naverMapUrl: "https://naver.me/5bdaPz65",
                    notes: ["位於 Centum City 旁，佔地達 700 多坪，利用全場大面積密集 LED 螢幕投射出夢幻璀璨的現代數字媒體藝術！", "完全是雨天散步打卡、文藝青年探索現代新媒體展覽的極佳溫暖去處。"]

                      {backupSpot.naverMapUrl && (

                rows={3}
              />

      }

      // 2. FINANCE TAB COMPONENT
      function FinanceTab({ expenses, exchangeRate, setManualExchangeRate, deleteExpense }) {
        const [subTab, setSubTab] = useState("spending");

        // Converter states
        const [krwInput, setKrwInput] = useState("10000");
        const [twdInput, setTwdInput] = useState((10000 * exchangeRate).toFixed(0));
        const [isKeypadOpen, setIsKeypadOpen] = useState(false);

        const updateTwdFromExpression = (expr) => {
          const evaluated = safeEvaluate(expr);
          const num = parseFloat(evaluated);
          if (!isNaN(num)) {
            setTwdInput(Math.round(num * exchangeRate).toString());
          } else {
            setTwdInput("");
          }
        };

        const handleKeypadPress = (key) => {
          if (key === "C") {
            setKrwInput("");
            setTwdInput("");
          } else if (key === "backspace") {
            setKrwInput((prev) => {
              const nextVal = prev.slice(0, -1);
              updateTwdFromExpression(nextVal);
              return nextVal;
            });
          } else if (key === "=") {
            setKrwInput((prev) => {
              const evaluated = safeEvaluate(prev);
              updateTwdFromExpression(evaluated);
              return evaluated;
            });
          } else if (["+", "-", "*", "/"].includes(key)) {
            setKrwInput((prev) => {
              const lastChar = prev.slice(-1);
              if (["+", "-", "*", "/"].includes(lastChar)) {
                return prev.slice(0, -1) + key;
              }
              return prev + key;
            });
          } else {
            setKrwInput((prev) => {
              const nextVal = prev + key;
              updateTwdFromExpression(nextVal);
              return nextVal;
            });
          }
        };

        // Budget numbers
        const dailyBudgetLimit = 150000;
        const exchangeRateDisplay = Math.round(1 / exchangeRate);

        const totalSpentKRW = expenses.reduce((sum, e) => sum + e.amount, 0);
        const totalSpentTWD = Math.round(totalSpentKRW * exchangeRate);

        const getSubtotalForDay = (dayNum) => {
          return expenses.filter((e) => e.day === dayNum).reduce((sum, e) => sum + e.amount, 0);
        };

        return (
          <div className="space-y-5 pb-10">
            {/* Top Sub tabs toggle selection */}
            <div className="flex bg-[#F0EAE1] rounded-2xl p-1 border border-[#DCD5C9] select-none">
              <button
                onClick={() => setSubTab("spending")}
                className={`flex-1 py-2.5 rounded-xl transition-all font-black text-xs cursor-pointer ${
                  subTab === "spending" ? "bg-[#768A7A] text-white shadow-sm" : "text-[#8C7E74] hover:text-[#3F2B20]"
                }`}
              >
                📊 累積統計明細
              </button>
              <button
                onClick={() => setSubTab("exchange")}
                className={`flex-1 py-2.5 rounded-xl transition-all font-black text-xs cursor-pointer ${
                  subTab === "exchange" ? "bg-[#768A7A] text-white shadow-sm" : "text-[#8C7E74] hover:text-[#3F2B20]"
                }`}
              >
                ⚖️ 韓元快速算盤
              </button>
            </div>

            {subTab === "spending" && (

      // 4. TRANSLATOR TAB COMPONENT
      function TranslatorTab({ phrases, addPhrase, deletePhrase }) {
        const [selectedCategory, setSelectedCategory] = useState("全部");
        const [searchQuery, setSearchQuery] = useState("");
        const [chineseIn, setChineseIn] = useState("");
        const [koreanIn, setKoreanIn] = useState("");
        const [papagoText, setPapagoText] = useState("");
        const [isPlayingId, setIsPlayingId] = useState(null);

        const handleFormSubmit = (e) => {
          e.preventDefault();
          if (!chineseIn.trim() || !koreanIn.trim()) return;
          addPhrase(chineseIn.trim(), koreanIn.trim());
          setChineseIn("");
          setKoreanIn("");
        };

        const triggerSpeak = (text, id) => {
          if (!("speechSynthesis" in window)) {
            alert("此裝置瀏覽器不支援 Web Speech TTS 語音播放功能");
            return;
          }
          try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "ko-KR";
            utterance.rate = 0.8;
            utterance.onstart = () => setIsPlayingId(id);
            utterance.onend = () => setIsPlayingId(null);
            utterance.onerror = () => setIsPlayingId(null);
            window.speechSynthesis.speak(utterance);
          } catch (e) {
            console.error("TTS output failed", e);
            setIsPlayingId(null);
          }
        };

        const categoriesList = ["全部", "常用", "交通", "美食", "購物", "緊急", "我的自訂"];

        const filteredPhrases = phrases.filter((phrase) => {
          const matchesCategory = selectedCategory === "全部" || phrase.category === selectedCategory;
          const searchLower = searchQuery.toLowerCase();
          const matchesSearch =
            phrase.chinese.toLowerCase().includes(searchLower) ||
            phrase.korean.toLowerCase().includes(searchLower);
          return matchesCategory && matchesSearch;
        });

        return (
          <div className="space-y-5 pb-10">
            {/* Papago redirection box */}
            <div className="bg-[#FFFDF9] rounded-2xl p-5 border border-[#E8E1D5] shadow-xs">

              <div className="bg-[#FAF5EB]/50 p-4 rounded-xl border border-[#DCD5C9]/50 space-y-3">
                <input
                  type="text"
                  placeholder="例：請問這個還有大一號的尺碼嗎？"
                  value={papagoText}
                  onChange={(e) => setPapagoText(e.target.value)}
                  className="w-full text-xs sm:text-sm bg-white border border-[#EBE5DA] rounded-xl px-3.5 py-3 text-[#3F2B20] font-semibold"
                />
                <a
                  href={`https://papago.naver.com/?sk=zh-CN&tk=ko&hn=1&st=${encodeURIComponent(papagoText.trim() || "請問這個還有大一號的嗎？")}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full py-3 bg-[#768A7A] hover:bg-[#5C6E60] text-white text-xs font-black text-center rounded-xl block cursor-pointer transition-colors select-none"
                >
                  💬 開啟 Naver Papago 網頁翻譯
                </a>
              </div>
            </div>

            {/* Main Phrase Database */}
            <div className="bg-[#FFFDF9] rounded-2xl p-5 border border-[#E8E1D5] shadow-xs">
              <h3 className="font-serif font-black text-base text-[#3F2B20] mb-3.5 border-b border-[#FAF5EB] pb-2">🔊 日常口說高頻句庫</h3>
              
              <div className="space-y-3">
                <input
                  type="text"
                  placeholder="輸入關鍵字以搜尋句子..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#FAF5EB] border border-[#E8E1D5] rounded-xl px-3 py-2 text-xs text-charcoal focus:border-[#A47551] font-semibold"
                />

                {/* Horizontal Category Slider */}
                <div className="flex gap-1.5 overflow-x-auto py-1 no-scrollbar select-none">
                  {categoriesList.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`flex-shrink-0 text-[10px] px-2.5 py-1.5 rounded-lg border transition-all cursor-pointer ${
                        selectedCategory === cat
                          ? "bg-[#A47551] text-[#FAF6EE] border-[#A47551] font-black"
                          : "bg-[#FAF5EB] text-[#8C7E74] border-[#E8E1D5]"
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Loop list phrases */}
              <div className="mt-4 space-y-3">
                {filteredPhrases.map((phrase) => (
                  <div key={phrase.id} className="p-3.5 rounded-xl bg-[#FFFDF9] border border-[#E8E1D5]/40 flex items-center justify-between gap-3 text-xs leading-snug">
                    <div className="space-y-1 flex-1 min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[8px] font-black bg-orange-50 text-orange-600 px-1.5 rounded uppercase">{phrase.category}</span>
                        <h4 className="font-extrabold text-gray-400 text-[11px] font-sans">{phrase.chinese}</h4>
                      </div>
                      <p className="font-serif font-black text-charcoal text-[14px] sm:text-base select-all break-words tracking-wide">{phrase.korean}</p>
                    </div>

                    <div className="flex items-center gap-1 shrink-0 select-none">
                      <button
                        onClick={() => triggerSpeak(phrase.korean, phrase.id)}
                        className={`h-9 w-9 rounded-lg border flex items-center justify-center cursor-pointer transition-colors ${
                          isPlayingId === phrase.id ? "bg-amber-400 text-white" : "bg-gray-50 text-[#A47551] hover:bg-[#A47551]/10 border-gray-200"
                        }`}
                      >
                        📢
                      </button>
                      {phrase.category === "我的自訂" && (
                        <button
                          onClick={() => deletePhrase(phrase.id)}
                          className="h-9 w-9 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 border border-red-200 flex items-center justify-center cursor-pointer"
                        >
                          ❌
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Custom additions */}
            <div className="bg-[#FFFDF9] rounded-2xl p-5 border border-[#E8E1D5] shadow-xs">
              <h3 className="font-serif font-black text-base text-[#A47551] mb-3">➕ 新增常用對話備忘記錄</h3>
              <form onSubmit={handleFormSubmit} className="space-y-2.5">
                <input
                  type="text"
                  required
                  placeholder="中文說明意思 (例：這張卡可以刷嗎)"
                  value={chineseIn}
                  onChange={(e) => setChineseIn(e.target.value)}
                  className="w-full text-xs bg-[#FFFDF9] border border-[#EBE5DA] rounded-xl px-3 py-2.5 text-[#3F2B20] font-semibold"
                />
                <input
                  type="text"
                  required
                  placeholder="韓文句子 (例：카드 가능한가요)"
                  value={koreanIn}
                  onChange={(e) => setKoreanIn(e.target.value)}
                  className="w-full text-xs bg-[#FFFDF9] border border-[#EBE5DA] rounded-xl px-3 py-2.5 text-[#3F2B20] font-semibold"
                />
                <button type="submit" className="w-full py-2.5 bg-gray-200 text-charcoal text-xs font-black rounded-xl select-none shadow-3xs cursor-pointer">確認新增至句庫列表 ➔</button>
              </form>
            </div>
          </div>
        );
      }

      // 5. BASIC INFO TAB COMPONENT
      function BasicInfoTab() {
        const [copied, setCopied] = useState(null);

        const handleCopy = (text, id) => {
          navigator.clipboard.writeText(text);
          setCopied(id);
          setTimeout(() => setCopied(null), 2000);
        };

        return (
          <div className="space-y-4.5 pb-10">
            {/* Outbound & Inbound Flights cards */}
            <div className="grid grid-cols-1 gap-4 select-none">
              <div className="bg-[#FFFDF9] rounded-2xl p-4.5 border border-[#E8E1D5] space-y-3.5">
                <div className="flex justify-between items-center border-b border-[#FAF5EB] pb-2">
                  <span className="text-[9px] font-black tracking-widest text-[#547963] bg-[#E2ECE5] px-2 py-0.5 rounded uppercase">去程 OUTBOUND</span>
                  <span className="text-[10px] text-gray-400 font-bold">2026/06/22 (日)</span>
                </div>
                <div className="flex items-center justify-between text-xs font-semibold">
                  <div>
                    <span className="text-gray-400 block font-bold text-[10px]">高雄小港 KHH</span>
                    <span className="text-xl font-black text-charcoal">17:00</span>
                  </div>
                  <div className="text-center text-gray-400">
                    <span className="text-[9px] font-bold">3h 30m</span>
                    <div className="w-20 h-px bg-gray-200 relative my-0.5"><span className="absolute -top-1 right-0">🛫</span></div>
                    <span className="text-[8px] font-black block">濟州航空</span>
                  </div>
                  <div className="text-right">
                    <span className="text-gray-400 block font-bold text-[10px]">釜山金海 PUS</span>
                    <span className="text-xl font-black text-charcoal">20:30</span>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-[10px] text-gray-500 font-bold pt-2 border-t border-dashed border-gray-100">
                  <div className="text-center bg-gray-50 p-1.5 rounded">小港機場 3 樓櫃台</div>
                  <div className="text-center bg-gray-50 p-1.5 rounded">隨身10Kg/託運15Kg</div>
                </div>
              </div>

              <div className="bg-[#FFFDF9] rounded-2xl p-4.5 border border-[#E8E1D5] space-y-3.5">
                <div className="flex justify-between items-center border-b border-[#FAF5EB] pb-2">
                  <span className="text-[9px] font-black tracking-widest text-red-600 bg-red-50 px-2 py-0.5 rounded uppercase">回程 INBOUND</span>
                  <span className="text-[10px] text-gray-400 font-bold">2026/06/25 (三)</span>
                </div>
                <div className="flex items-center justify-between text-xs font-semibold">
                  <div>
                    <span className="text-gray-400 block font-bold text-[10px]">釜山金海 PUS</span>
                    <span className="text-xl font-black text-charcoal">15:00</span>
                  </div>
                  <div className="text-center text-gray-400">
                    <span className="text-[9px] font-bold">1h 50m</span>
                    <div className="w-20 h-px bg-gray-200 relative my-0.5"><span className="absolute -top-1 right-0">🛬</span></div>
                    <span className="text-[8px] font-black block">德威航空</span>
                  </div>
                  <div className="text-right">
                    <span className="text-gray-400 block font-bold text-[10px]">高雄小港 KHH</span>
                    <span className="text-xl font-black text-charcoal">16:50</span>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-[10px] text-gray-500 font-bold pt-2 border-t border-dashed border-gray-100">
                  <div className="text-center bg-gray-50 p-1.5 rounded">金海機場 2 樓登機 C 區</div>
                  <div className="text-center bg-gray-50 p-1.5 rounded">隨身10Kg/託運15Kg</div>
                </div>
              </div>
            </div>

            {/* Hotel accommodation card */}
            <div className="bg-[#FFFDF9] rounded-2xl p-5 border border-[#E8E1D5] space-y-3 shadow-xs">
              <div className="flex justify-between items-center select-none">
                <span className="text-[9px] font-black text-[#A47551] bg-[#FAF5EB] px-2.5 py-0.5 rounded">HOTEL ACCOMMODATION</span>
                <a href={initialHotel.url} target="_blank" rel="noopener noreferrer" className="text-[10px] font-black text-[#768A7A] hover:underline flex items-center gap-0.5">🌐 地圖導航 ➔</a>
              </div>
              <div>
                <h3 className="font-serif font-black text-lg text-[#3F2B20] leading-none">{initialHotel.name}</h3>
                <p className="text-[11px] font-bold text-gray-400 mt-1 font-mono">{initialHotel.krName}</p>
              </div>
              <div className="p-3 rounded-lg bg-[#FAF5EB] border border-[#E8E1D5]/40 flex justify-between items-center gap-3 select-text">
                <p className="text-[11.5px] font-semibold text-charcoal leading-relaxed">📍 地址：{initialHotel.address}</p>
                <button
                  onClick={() => handleCopy(initialHotel.address, "hotel-addr")}
                  className="px-2.5 py-1 text-[10.5px] bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 rounded font-black shrink-0 cursor-pointer shadow-3xs"
                >
                  {copied === "hotel-addr" ? "已複製" : "複製地址"}
                </button>
              </div>
            </div>

            {/* Search Toilet keywords */}
            <div className="bg-[#FFFDF9] rounded-2xl p-5 border border-[#E8E1D5] shadow-xs select-none space-y-3">
              <h3 className="font-serif font-black text-base text-[#3F2B20] flex items-center gap-1.5">🚽 在釜山街頭緊急找公用化妝室</h3>
              <p className="text-[11px] text-gray-400 font-semibold leading-relaxed">點擊以下關鍵字將會自動開啟 Naver Map 深度搜尋周邊最合適的便溺化妝設施：</p>
              <div className="grid grid-cols-2 gap-2 text-xs font-black">
                <a href="https://map.naver.com/v5/search/지하철" target="_blank" rel="noopener noreferrer" className="p-3 bg-[#FAF5EB]/60 hover:bg-[#FAF5EB] border border-[#E8E1D5]/40 rounded-xl text-center cursor-pointer transition-colors block">🚇 地鐵公共洗手間</a>
                <a href="https://map.naver.com/v5/search/쇼핑몰" target="_blank" rel="noopener noreferrer" className="p-3 bg-[#FAF5EB]/60 hover:bg-[#FAF5EB] border border-[#E8E1D5]/40 rounded-xl text-center cursor-pointer transition-colors block">🏢 豪華百貨商場</a>
                <a href="https://map.naver.com/v5/search/개방화장실" target="_blank" rel="noopener noreferrer" className="p-3 bg-[#FAF5EB]/60 hover:bg-[#FAF5EB] border border-[#E8E1D5]/40 rounded-xl text-center cursor-pointer transition-colors block">🔓 對外高頻開放化妝室</a>
                <a href="https://map.naver.com/v5/search/공용화장실" target="_blank" rel="noopener noreferrer" className="p-3 bg-[#FAF5EB]/60 hover:bg-[#FAF5EB] border border-[#E8E1D5]/40 rounded-xl text-center cursor-pointer transition-colors block">🚻 景點共用衛生間</a>
              </div>
            </div>
          </div>
        );
      }

      // Render Mounting triggers
      const rootNode = ReactDOM.createRoot(document.getElementById("root"));
      rootNode.render(<App />);
    </script>
  </body>
</html>
